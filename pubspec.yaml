name: shamsi_reminder
description: "Samsung Reminder Persian Clone with Jalali Calendar, Home Widget, and Voice NLP"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Jalali / Shamsi Calendar (الزامی)
  shamsi_date: ^1.1.0

  # Local Database
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Home Screen Widget (الزامی)
  home_widget: ^0.7.0

  # Notifications & Actions (Snooze, Complete)
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3

  # Voice & Speech recognition (v7+ drops legacy Registrar for Flutter 3.29 compatibility)
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

  # Shared Preferences & Sound
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
